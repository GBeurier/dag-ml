name: Methods-backed Octave build candidate

# Builds/version/MEX readiness only. Full local qualification commands:
# docs/qualification/methods-candidates-local.md. No package is published.
on:
  workflow_dispatch:
    inputs:
      methods_ref:
        description: "Methods commit containing the public Octave RolePipeline binding"
        required: true
        default: main
      sdk_ref:
        description: "nirs4all commit containing public native phase facades and Octave tests"
        required: true
        default: main
      core_version:
        description: "Installed Core distribution version providing Archive V2"
        required: true
        default: "0.4.0"

permissions:
  contents: read

jobs:
  octave-native-role-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: GBeurier/nirs4all-methods
          ref: ${{ inputs.methods_ref }}
          fetch-depth: 0
          path: external/nirs4all-methods
      - uses: actions/checkout@v7
        with:
          repository: GBeurier/nirs4all
          ref: ${{ inputs.sdk_ref }}
          path: external/nirs4all
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install a real Octave with native JSON and MEX tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends octave octave-dev ninja-build cmake
          python -m pip install 'maturin>=1.13,<2' pytest jsonschema 'nirs4all-methods==1.2.1'
          python -m pip install 'nirs4all-core==${{ inputs.core_version }}'
          python -m pip install ./external/nirs4all
      - name: Select public ABI 2.14 library and matching released headers
        shell: bash
        run: |
          mkdir -p external/abi214-source
          git -C external/nirs4all-methods archive v1.2.1 | tar -x -C external/abi214-source
          (cd external/abi214-source && cmake --preset dev-release)
          python - <<'PYCODE'
          from pathlib import Path
          import os
          import n4m
          lib = Path(n4m.__file__).parent / "lib"
          exact = lib / "libn4m.so.2.14.0"
          assert exact.is_file(), "The released ABI 2.14 library is required"
          root = Path.cwd()
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key, value in {
                  "N4M_LIB_DIR": lib,
                  "N4M_LIBRARY_PATH": exact,
                  "N4M_INCLUDE_DIR": root / "external/abi214-source/cpp/include",
                  "N4M_GENERATED_DIR": root / "external/abi214-source/build/dev-release/generated",
                  "DAG_ML_OCTAVE_METHODS_PATH": root / "external/nirs4all-methods/bindings/matlab",
                  "N4M_ROLE_PIPELINE_JSON_FIXTURE": root / "external/abi214-source/parity/fixtures/role_pipeline_negative.json",
              }.items():
                  output.write(f"{key}={value}\n")
          PYCODE
      - name: Compile the real public Methods role and version MEX
        working-directory: external/nirs4all-methods/bindings/matlab
        run: octave --no-gui --quiet --eval "build_mex({'n4m_role_pipeline_mex','n4m_version_mex'})"
      - name: Check real public Methods MEX version and role binding readiness
        working-directory: external/nirs4all-methods/bindings/matlab
        run: octave --no-gui --quiet --eval "assert(exist(fullfile(pwd, '+n4m', ['n4m_role_pipeline_mex.' mexext()]), 'file') == 3); assert(exist(fullfile(pwd, '+n4m', ['n4m_version_mex.' mexext()]), 'file') == 3); assert(strcmp(n4m.n4m_version_mex(), '1.2.1+abi.2.14.0')); disp('METHODS_MEX_VERSION_AND_ROLE_READY')"
      - name: Build current DAG Python wheel and CLI
        run: |
          maturin build --release --locked --manifest-path crates/dag-ml-py/Cargo.toml \
            --features extension-module,methods-optimizer --out target/octave-wheels
          python -m pip install --force-reinstall --no-deps target/octave-wheels/dag_ml-*.whl
          cargo build -p dag-ml-cli --release --features dag-ml-core/methods-optimizer
      - name: Check built DAG facade and installed package metadata
        env:
          EXPECTED_CORE_VERSION: ${{ inputs.core_version }}
        run: |
          python - <<'PYCODE'
          from importlib import metadata
          import json
          import os
          import tomllib
          import dag_ml
          import dag_ml._dag_ml as native
          with open("crates/dag-ml-py/pyproject.toml", "rb") as handle:
              expected = tomllib.load(handle)["project"]["version"]
          assert metadata.version("dag-ml") == dag_ml.version() == native.version() == expected
          assert json.loads(dag_ml.contract_manifest_json())["python_package_version"] == expected
          assert metadata.version("nirs4all-core") == os.environ["EXPECTED_CORE_VERSION"]
          print("INSTALLED_PACKAGE_VERSIONS_OK", expected, metadata.version("nirs4all"))
          PYCODE
      - name: Require both package MEX outputs before upload
        run: |
          shopt -s nullglob
          for mex_name in n4m_role_pipeline_mex n4m_version_mex; do
            matches=(external/nirs4all-methods/bindings/matlab/+n4m/"$mex_name".mex*)
            if [[ "${#matches[@]}" -ne 1 || ! -s "${matches[0]}" ]]; then
              echo "::error::Expected one nonempty package MEX output for $mex_name"
              exit 1
            fi
          done
      - name: Retain candidate build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: octave-methods-build-candidate
          path: |
            target/octave-wheels
            target/release/dag-ml-cli
            external/nirs4all-methods/bindings/matlab/+n4m/n4m_role_pipeline_mex.mex*
            external/nirs4all-methods/bindings/matlab/+n4m/n4m_version_mex.mex*
          if-no-files-found: error
          retention-days: 30
