name: release-npm

on:
  workflow_dispatch:
    inputs:
      release_source_tag:
        description: "Recovery only: immutable stable source tag (empty keeps normal candidate behavior)"
        type: string
        default: ""
      expected_source_sha:
        description: "Recovery only: exact 40-character source commit; tag must resolve identically"
        type: string
        default: ""
      publish:
        description: "Publish to npm (true) or dry-run only (false)"
        type: boolean
        default: false
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  qualify:
    uses: ./.github/workflows/ci.yml
  build-and-publish:
    needs: qualify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_source_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify immutable recovery source
        if: inputs.release_source_tag != ''
        shell: bash
        env:
          RELEASE_SOURCE_TAG: ${{ inputs.release_source_tag }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          DEVELOPMENT_CANDIDATE: false
        run: |
          set -euo pipefail
          [[ "$RELEASE_SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEVELOPMENT_CANDIDATE" != "true" ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse "$RELEASE_SOURCE_TAG^{commit}")" = "$EXPECTED_SOURCE_SHA"
          python scripts/verify_local_qualification.py --project dag --receipt compat/local-qualification.json --root .

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: "v0.15.0"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Build the WASM module
        run: |
          set -euo pipefail
          out_dir="$PWD/target/wasm-web/dag-ml-wasm"
          wasm-pack build crates/dag-ml-wasm --target web --out-dir "$out_dir" --release
          node scripts/stage_wasm_host_adapters.mjs "$out_dir"

      - name: Pin npm metadata
        working-directory: target/wasm-web/dag-ml-wasm
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.name = "dag-ml-wasm";
            p.repository = { type: "git", url: "git+https://github.com/GBeurier/dag-ml.git", directory: "crates/dag-ml-wasm" };
            p.publishConfig = { access: "public", provenance: true };
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '

      - name: Smoke-test web WASM bindings
        run: node scripts/smoke_wasm_web_bindings.mjs target/wasm-web/dag-ml-wasm

      - name: Validate npm tarball metadata
        run: node scripts/smoke_wasm_tarball_metadata.mjs target/wasm-web/dag-ml-wasm

      - name: Validate tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_source_tag != ''
        env:
          RELEASE_SOURCE_TAG: ${{ inputs.release_source_tag || github.ref_name }}
        working-directory: target/wasm-web/dag-ml-wasm
        run: |
          set -euo pipefail
          pkg_ver=$(node -p "require('./package.json').version")
          tag_ver="${RELEASE_SOURCE_TAG#v}"
          tag_ver="${tag_ver%%-rc*}"
          echo "package.json=$pkg_ver tag=$GITHUB_REF_NAME"
          if [ "$pkg_ver" != "$tag_ver" ]; then
            echo "ERROR: package.json version ($pkg_ver) != tag (${RELEASE_SOURCE_TAG#v})."
            exit 1
          fi

      - name: Decide publish
        id: gate
        env:
          RELEASE_SOURCE_TAG: ${{ inputs.release_source_tag || github.ref_name }}
          RECOVERY_TAG: ${{ inputs.release_source_tag }}
          REQUEST_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$REQUEST_PUBLISH" == "true" ]] && [[ ! "$RELEASE_SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: npm publication requires an immutable stable release tag."
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" && "$RELEASE_SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$REQUEST_PUBLISH" == "true" && ( "${GITHUB_REF_TYPE}" == "tag" || -n "$RECOVERY_TAG" ) ]]; then
            echo "do=true" >> "$GITHUB_OUTPUT"
          else
            echo "do=false" >> "$GITHUB_OUTPUT"
            echo "Dry-run only (no publish)."
          fi

      - name: Verify local runtime qualification before publication
        if: steps.gate.outputs.do == 'true'
        run: python scripts/verify_local_qualification.py --project dag --receipt compat/local-qualification.json --root .

      - name: Publish to npm
        if: steps.gate.outputs.do == 'true'
        working-directory: target/wasm-web/dag-ml-wasm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          pkg_name=$(node -p "require('./package.json').name")
          pkg_ver=$(node -p "require('./package.json').version")
          if npm view "${pkg_name}@${pkg_ver}" version >/dev/null 2>&1; then
            echo "${pkg_name}@${pkg_ver} is already published; skipping."
          else
            npm publish --access public
          fi
