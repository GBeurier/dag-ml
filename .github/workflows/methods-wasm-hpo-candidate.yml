name: Methods-backed WASM HPO candidate

# Cross-repository qualification only. No npm or Python package is published.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/methods-wasm-hpo-candidate.yml
      - examples/adapters/hpo_n4m_wasm_adapter.mjs
      - bindings/js/**
      - scripts/stage_wasm_host_adapters.mjs
      - scripts/fixtures/wasm_host_adapter_consumer.*
      - scripts/fixtures/methods_four_source_relation_identity.json
      - scripts/smoke_wasm_multimodal_methods_hpo.mjs
      - scripts/test_wasm_n4m_controller.mjs
      - scripts/qualify_multimodal_methods_hpo_python.py
      - scripts/qualify_multimodal_methods_nirs4all.py
      - scripts/smoke_wasm_n4m_hpo.mjs
      - scripts/wasm_ridge_refit_oracle.mjs
      - crates/dag-ml-wasm/**
      - crates/dag-ml-core/src/hpo.rs
      - crates/dag-ml-core/src/runtime/host_hpo.rs
      - crates/dag-ml-core/src/training_runtime.rs
      - crates/dag-ml-core/tests/fixtures/initial_full_refit/package.json
      - Cargo.lock
  workflow_dispatch:
    inputs:
      methods_ref:
        description: "nirs4all-methods commit containing the JS optimizer"
        required: true
        default: "0ffe6f2339514ab71adfe6d60ae0d584e7a20902"

permissions:
  contents: read

jobs:
  native-methods-js-hpo:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: GBeurier/nirs4all-methods
          ref: ${{ inputs.methods_ref || '0ffe6f2339514ab71adfe6d60ae0d584e7a20902' }}
          path: external/nirs4all-methods
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Install Methods build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake
      - name: Build current DAG-ML Node WASM package
        run: |
          cargo install wasm-pack --version 0.15.0 --locked
          wasm-pack build crates/dag-ml-wasm --target nodejs --out-dir "$PWD/target/wasm/dag-ml-wasm" --release
          node scripts/stage_wasm_host_adapters.mjs "$PWD/target/wasm/dag-ml-wasm"
          wasm-pack build crates/dag-ml-wasm --target web --out-dir "$PWD/target/wasm-web/dag-ml-wasm" --release
          node scripts/stage_wasm_host_adapters.mjs "$PWD/target/wasm-web/dag-ml-wasm"
          node scripts/smoke_wasm_bindings.cjs "$PWD/target/wasm/dag-ml-wasm"
          node scripts/smoke_wasm_web_bindings.mjs "$PWD/target/wasm-web/dag-ml-wasm"
          node scripts/smoke_wasm_tarball_metadata.mjs "$PWD/target/wasm/dag-ml-wasm"
          node scripts/smoke_wasm_tarball_metadata.mjs "$PWD/target/wasm-web/dag-ml-wasm"
      - name: Build candidate Methods JS/WASM without publishing
        working-directory: external/nirs4all-methods
        run: |
          cmake --preset emscripten
          cmake --build --preset emscripten --target n4m_wasm
          cd bindings/js
          npm ci
          npm run build
          npm run stage:wasm
      - name: Check extracted package imports and TypeScript consumers
        run: |
          for target in wasm wasm-web; do
            consumer="$RUNNER_TEMP/consumer-$target"
            mkdir -p "$consumer/node_modules/dag-ml-wasm"
            npm pack --pack-destination "$consumer" "$PWD/target/$target/dag-ml-wasm"
            tar -xzf "$consumer"/dag-ml-wasm-*.tgz --strip-components=1 -C "$consumer/node_modules/dag-ml-wasm"
            cp scripts/fixtures/wasm_host_adapter_consumer.mjs "$consumer/consumer.mjs"
            node "$consumer/consumer.mjs"
            mkdir -p "$consumer/node_modules/@nirs4all"
            ln -s "$PWD/external/nirs4all-methods/bindings/js" "$consumer/node_modules/@nirs4all/methods"
            cp scripts/fixtures/wasm_host_adapter_consumer.mts "$consumer/consumer.mts"
            node external/nirs4all-methods/bindings/js/node_modules/typescript/lib/tsc.js \
              --strict --noEmit --module NodeNext --moduleResolution NodeNext \
              --target ES2022 --lib ESNext,DOM "$consumer/consumer.mts"
          done
      - name: Fit Ridge with Methods proposals, resume and replay selected refit
        run: |
          node scripts/smoke_wasm_n4m_hpo.mjs \
            "$PWD/target/wasm/dag-ml-wasm" \
            "$PWD/external/nirs4all-methods/bindings/js/dist"
      - name: Qualify the public controller and four-source nested OOF search
        run: |
          node scripts/test_wasm_n4m_controller.mjs \
            "$PWD/target/wasm/dag-ml-wasm" \
            "$PWD/external/nirs4all-methods/bindings/js/dist"
          node scripts/smoke_wasm_multimodal_methods_hpo.mjs \
            "$PWD/target/wasm/dag-ml-wasm" \
            "$PWD/external/nirs4all-methods/bindings/js/dist" \
            "$RUNNER_TEMP/four-source-receipt.json"
          node scripts/test_wasm_n4m_controller.mjs \
            "$PWD/target/wasm-web/dag-ml-wasm" \
            "$PWD/external/nirs4all-methods/bindings/js/dist"
          node scripts/smoke_wasm_multimodal_methods_hpo.mjs \
            "$PWD/target/wasm-web/dag-ml-wasm" \
            "$PWD/external/nirs4all-methods/bindings/js/dist"
      - name: Preserve the unchanged four-source qualification capture
        uses: actions/upload-artifact@v7
        with:
          name: methods-four-source-fixture
          path: ${{ runner.temp }}/four-source-receipt.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compare native Python folds and scores with the WASM search
        run: |
          python -m pip install 'dag-ml==0.3.32' 'nirs4all-methods==1.2.1' 'pls4all==1.2.1' numpy scikit-learn
          python scripts/qualify_multimodal_methods_hpo_python.py \
            "$RUNNER_TEMP/four-source-receipt.json" "$RUNNER_TEMP/python-parity.json"
