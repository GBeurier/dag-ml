name: Artifact facets contract

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  schema-instance:
    name: Host and native_role captures validated against the v1 schema (shape only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Contract validator dependencies
        run: python -m pip install -r scripts/requirements-contracts.txt
      - name: Artifact facets schema-instance gate (both default captures)
        run: python scripts/validate_artifact_facets_contract.py
      - name: Artifact facets regression tests
        run: python -m unittest discover -s tests -p test_artifact_facets_contract.py -v
