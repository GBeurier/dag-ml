name: release-python

on:
  # Manual dispatch builds candidate artifacts only; exact source version is opt-in.
  workflow_dispatch:
    inputs:
      release_source_tag:
        description: "Recovery only: immutable stable source tag (empty keeps normal candidate behavior)"
        type: string
        default: ""
      expected_source_sha:
        description: "Recovery only: exact 40-character source commit; tag must resolve identically"
        type: string
        default: ""
      development_candidate:
        description: "Build next-patch .dev0 candidate (false builds exact source version; neither publishes)"
        type: boolean
        default: true
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PACKAGE_DIR: crates/dag-ml-py
  PACKAGE_NAME: dag-ml
  RELEASE_SOURCE_TAG: ${{ inputs.release_source_tag || github.ref_name }}

jobs:
  qualify:
    uses: ./.github/workflows/ci.yml
  build-wheels:
    name: Build ${{ matrix.target }} wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
            target: x86_64
            smoke: true
          - os: ubuntu-22.04
            label: linux-aarch64
            target: aarch64
            smoke: false
          - os: macos-15-intel
            label: macos-x86_64
            target: x86_64
            smoke: false
          - os: macos-14
            label: macos-aarch64
            target: aarch64
            smoke: false
          - os: windows-2022
            label: windows-x64
            target: x64
            smoke: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_source_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify immutable recovery source
        if: inputs.release_source_tag != ''
        shell: bash
        env:
          RELEASE_SOURCE_TAG: ${{ inputs.release_source_tag }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          DEVELOPMENT_CANDIDATE: ${{ inputs.development_candidate }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEVELOPMENT_CANDIDATE" != "true" ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse "$RELEASE_SOURCE_TAG^{commit}")" = "$EXPECTED_SOURCE_SHA"
          python scripts/verify_local_qualification.py --project dag --receipt compat/local-qualification.json --root .
      - name: Prepare distinct Python development candidate
        if: github.event_name == 'workflow_dispatch' && inputs.development_candidate && inputs.release_source_tag == ''
        run: python scripts/prepare_python_candidate.py
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked --out dist --manifest-path ${{ env.PACKAGE_DIR }}/Cargo.toml
          manylinux: auto
          sccache: true
      - name: Validate wheel metadata
        shell: bash
        run: python scripts/smoke_python_wheel_metadata.py dist/*.whl
      - name: Smoke-test installed wheel
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --force-reinstall dist/*.whl
          python scripts/smoke_python_bindings.py
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_source_tag == '' && 'candidate-wheels' || 'wheels' }}-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_source_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify immutable recovery source
        if: inputs.release_source_tag != ''
        shell: bash
        env:
          RELEASE_SOURCE_TAG: ${{ inputs.release_source_tag }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          DEVELOPMENT_CANDIDATE: ${{ inputs.development_candidate }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEVELOPMENT_CANDIDATE" != "true" ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse "$RELEASE_SOURCE_TAG^{commit}")" = "$EXPECTED_SOURCE_SHA"
          python scripts/verify_local_qualification.py --project dag --receipt compat/local-qualification.json --root .
      - name: Prepare distinct Python development candidate
        if: github.event_name == 'workflow_dispatch' && inputs.development_candidate && inputs.release_source_tag == ''
        run: python scripts/prepare_python_candidate.py
      - run: python -m pip install --upgrade maturin twine
      - name: Build source distribution
        run: maturin sdist --out dist --manifest-path ${{ env.PACKAGE_DIR }}/Cargo.toml
      - name: Check source distribution
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_source_tag == '' && 'candidate-sdist' || 'sdist' }}
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs:
      - qualify
      - build-wheels
      - build-sdist
    runs-on: ubuntu-22.04
    if: ${{ (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && github.event_name != 'workflow_dispatch') || (github.event_name == 'workflow_dispatch' && inputs.release_source_tag != '' && !inputs.development_candidate) }}
    environment:
      name: pypi
      url: https://pypi.org/p/dag-ml
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_source_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify immutable recovery source
        if: inputs.release_source_tag != ''
        shell: bash
        env:
          RELEASE_SOURCE_TAG: ${{ inputs.release_source_tag }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          DEVELOPMENT_CANDIDATE: ${{ inputs.development_candidate }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEVELOPMENT_CANDIDATE" != "true" ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse "$RELEASE_SOURCE_TAG^{commit}")" = "$EXPECTED_SOURCE_SHA"
          python scripts/verify_local_qualification.py --project dag --receipt compat/local-qualification.json --root .
      - name: Require matching release manifests
        run: python scripts/validate_release_metadata.py --release
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Validate release version
        run: |
          set -euo pipefail
          package_version=$(python - <<'PY'
          import tomllib
          with open("crates/dag-ml-py/pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )
          tag_version="${RELEASE_SOURCE_TAG#v}"
          if [[ ! "${RELEASE_SOURCE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "${tag_version}" != "${package_version}" ]]; then
            echo "::error::Release tag ${RELEASE_SOURCE_TAG} does not match ${PACKAGE_NAME} ${package_version}."
            exit 1
          fi
          echo "Publishing ${PACKAGE_NAME} ${package_version} from ${RELEASE_SOURCE_TAG}."
      - name: Validate distribution metadata
        run: python scripts/smoke_python_wheel_metadata.py dist/*.whl
      - name: Validate Trusted Publisher release tuple
        run: |
          set -euo pipefail
          expected_repo="GBeurier/dag-ml"
          if [[ "${GITHUB_REPOSITORY}" != "${expected_repo}" ]]; then
            echo "::error::PyPI Trusted Publisher for project dag-ml must target owner=GBeurier repo=dag-ml workflow=release-python.yml environment=pypi; current repository is ${GITHUB_REPOSITORY}." >&2
            exit 1
          fi
          case "${GITHUB_WORKFLOW_REF}" in
            */.github/workflows/release-python.yml@*)
              ;;
            *)
              echo "::error::Expected GITHUB_WORKFLOW_REF to point at .github/workflows/release-python.yml, got ${GITHUB_WORKFLOW_REF}." >&2
              exit 1
              ;;
          esac
      - name: Verify local runtime qualification before publication
        run: python scripts/verify_local_qualification.py --project dag --receipt compat/local-qualification.json --root .
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  github-release:
    name: Attach Python artifacts to GitHub Release
    needs:
      - qualify
      - build-wheels
      - build-sdist
    runs-on: ubuntu-22.04
    if: ${{ (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && github.event_name != 'workflow_dispatch') || (github.event_name == 'workflow_dispatch' && inputs.release_source_tag != '' && !inputs.development_candidate) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_source_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify immutable recovery source
        if: inputs.release_source_tag != ''
        shell: bash
        env:
          RELEASE_SOURCE_TAG: ${{ inputs.release_source_tag }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          DEVELOPMENT_CANDIDATE: ${{ inputs.development_candidate }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEVELOPMENT_CANDIDATE" != "true" ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse "$RELEASE_SOURCE_TAG^{commit}")" = "$EXPECTED_SOURCE_SHA"
          python scripts/verify_local_qualification.py --project dag --receipt compat/local-qualification.json --root .
      - name: Verify local runtime qualification before publication
        run: python scripts/verify_local_qualification.py --project dag --receipt compat/local-qualification.json --root .
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_source_tag || github.ref_name }}
          files: dist/*
