# Non-publishable current-source reader for DAG-ML conformance only.
[workspace]

[package]
name = "dag-ml-current-core-oracle"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "CECILL-2.1 OR AGPL-3.0-or-later"

[dependencies]
nirs4all_archive_core = { package = "nirs4all", version = "=0.4.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
