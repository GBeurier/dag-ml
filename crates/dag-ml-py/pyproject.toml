[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "dag-ml"
version = "0.3.10"
description = "Python bindings for DAG-ML JSON contracts."
requires-python = ">=3.11"
license = "CECILL-2.1 OR AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "G. Beurier", email = "beurier@cirad.fr" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[tool.maturin]
# The published Python wheel exposes the portable native Methods PLS lane.
# Its dynamic N4M library remains explicit process configuration; no local
# checkout, path dependency, or library path is embedded in the wheel.
features = ["extension-module", "methods-optimizer"]
module-name = "dag_ml._dag_ml"
python-source = "python"
